name: Auto Render Islamic Video

on:
  push:
    paths:
      - 'story.json'

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python & Edge-TTS
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install edge-tts

      - name: Generate Voiceover & Sync Durations
        run: |
          mkdir -p public
          python -c "
          import json, subprocess, os

          with open('story.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          full_text = ' ... '.join([s['text'] for s in data['scenes']])
          voice = data.get('voice', 'en-US-AndrewNeural')
          subprocess.run(['edge-tts', '--voice', voice, '--text', full_text, '--write-media', 'public/voiceover.mp3'], check=True)
          "

      - name: Install Video Dependencies
        run: npm install

      - name: Render MP4 Video
        run: npx remotion render src/index.ts IslamicVideo out/video.mp4

      - name: Upload Finished Video
        uses: actions/upload-artifact@v4
        with:
          name: Islamic-Short-Video
          path: out/video.mp4
