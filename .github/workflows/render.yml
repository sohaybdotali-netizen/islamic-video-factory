name: Auto Render Islamic Video
on: [push, workflow_dispatch]
jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lightweight Urdu Fonts & FFmpeg
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install edge-tts mutagen
      - name: Generate Accurate Scholar & Student Voiceover
        run: |
          mkdir -p public
          python - << 'EOF'
          import json, subprocess, re
          from mutagen.mp3 import MP3

          with open('story.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          def clean_urdu_tts(t):
              t = re.sub(r'[\u064B-\u065F\u0670]', '', t)
              t = t.replace('ﷺ', ' صلی اللہ علیہ وسلم ')
              t = t.replace('ؓ', ' رضی اللہ عنہ ')
              t = t.replace('ؑ', ' علیہ السلام ')
              replacements = {
                  'قرآنِ': 'قرآن',
                  'ویڈیو': 'وڈیو',
                  'بتاو': 'بتاؤ',
                  'کل کتنی': 'مجموعی طور پر کتنی',
                  'سورت الناس': 'سورہ ان ناس',
                  'سورہ الناس': 'سورہ ان ناس',
                  'سورت الفاتحہ': 'سورہ فاتحہ',
                  'سورت البقرہ': 'سورہ بقرہ',
                  'سورت الکوثر': 'سورہ کوثر',
                  'الرحمن': 'ار رحمن',
                  'الرحیم': 'ار رحیم',
                  '۔': '. ',
                  '،': ', '
              }
              for old, new in replacements.items():
                  t = t.replace(old, new)
              t = re.sub(r'\s+', ' ', t).strip()
              if t and t[-1] not in '.؟!?':
                  t += '.'
              return t

          clip_files = []
          for i, scene in enumerate(data['scenes']):
              speaker = scene.get('speaker', 'teacher')
              clip = f"public/scene_{i}.mp3"

              if speaker == 'silent':
                  wait_sec = float(scene.get('durationInSeconds', 5))
                  subprocess.run(['ffmpeg', '-y', '-f', 'lavfi', '-i', 'anullsrc=r=24000:cl=mono', '-t', str(wait_sec), '-q:a', '9', clip], check=True)
                  scene['durationInSeconds'] = wait_sec
              else:
                  if speaker == 'student':
                      voice, rate, pitch = 'ur-PK-UzmaNeural', '+2%', '+18Hz'
                  else:
                      voice, rate, pitch = data.get('voice', 'ur-PK-AsadNeural'), '-8%', '-3Hz'

                  # Uses optional ttsText if provided, otherwise uses text (captions stay untouched)
                  raw_text = scene.get('ttsText') or scene['text']
                  spoken = clean_urdu_tts(raw_text)
                  subprocess.run(['edge-tts', '--voice', voice, f'--rate={rate}', f'--pitch={pitch}', '--text', spoken, '--write-media', clip], check=True)
                  audio = MP3(clip)
                  scene['durationInSeconds'] = round(audio.info.length + 0.5, 2)

              clip_files.append(f"file 'scene_{i}.mp3'")

          with open('public/list.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(clip_files))

          subprocess.run(['ffmpeg', '-y', '-f', 'concat', '-safe', '0', '-i', 'public/list.txt', '-c', 'copy', 'public/voiceover.mp3'], check=True)

          with open('public/story.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          EOF
      - run: npm install
      - run: npx remotion render src/index.ts IslamicVideo out/video.mp4 --bundle-cache=false
      - uses: actions/upload-artifact@v4
        with:
          name: Islamic-Short-Video
          path: out/video.mp4
