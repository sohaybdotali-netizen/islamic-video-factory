name: Auto Render Islamic Video
on: [push, workflow_dispatch]
jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Urdu Nastaliq Fonts & FFmpeg
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-noto-extra ffmpeg && fc-cache -fv
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install edge-tts mutagen
      - name: Generate Accurate Scholar Voiceover
        run: |
          mkdir -p public
          python - << 'EOF'
          import json, subprocess, re
          from mutagen.mp3 import MP3

          with open('story.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          voice = data.get('voice', 'ur-PK-AsadNeural')
          rate = '-8%' if 'ur-' in voice else '+0%'
          pitch = '-3Hz' if 'ur-' in voice else '+0Hz'

          def clean_urdu_tts(t):
              # 1. Remove ALL Arabic diacritics (Zabar, Zer, Pesh, Tashdeed) that confuse ur-PK-AsadNeural
              t = re.sub(r'[\u064B-\u065F\u0670]', '', t)
              # 2. Expand Islamic honorifics into plain, natural Urdu words
              t = t.replace('ﷺ', ' صلی اللہ علیہ وسلم ')
              t = t.replace('ؓ', ' رضی اللہ عنہ ')
              t = t.replace('ؑ', ' علیہ السلام ')
              # 3. Fix specific words ur-PK-AsadNeural misreads
              replacements = {
                  'قرآن': 'قران',
                  'ویڈیو': 'وڈیو',
                  'کوئز': 'کوز',
                  'آخری': 'آخری',
                  'سورتیں': 'سورتیں',
                  '۔': '. ',
                  '،': ', '
              }
              for old, new in replacements.items():
                  t = t.replace(old, new)
              return re.sub(r'\s+', ' ', t).strip()

          clip_files = []
          for i, scene in enumerate(data['scenes']):
              # Always read plain clean Urdu text
              spoken = clean_urdu_tts(scene['text'])
              clip = f"public/scene_{i}.mp3"
              subprocess.run(['edge-tts', '--voice', voice, f'--rate={rate}', f'--pitch={pitch}', '--text', spoken, '--write-media', clip], check=True)
              audio = MP3(clip)
              scene['durationInSeconds'] = round(audio.info.length + 0.6, 2)
              clip_files.append(f"file 'scene_{i}.mp3'")

          with open('public/list.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(clip_files))

          subprocess.run(['ffmpeg', '-y', '-f', 'concat', '-safe', '0', '-i', 'public/list.txt', '-c', 'copy', 'public/voiceover.mp3'], check=True)

          with open('story.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          EOF
      - run: npm install
      - run: npx remotion render src/index.ts IslamicVideo out/video.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: Islamic-Short-Video
          path: out/video.mp4
