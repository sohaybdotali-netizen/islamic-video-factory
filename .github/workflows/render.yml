
name: Auto Render Islamic Video

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and Urdu fonts
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        timeout-minutes: 5
        run: |
          python -m pip install --disable-pip-version-check edge-tts mutagen

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Urdu voices and audio
        timeout-minutes: 20
        run: |
          python -u - <<'PY'
          import json
          import re
          import subprocess
          import time
          from pathlib import Path
          from mutagen.mp3 import MP3

          PUBLIC = Path("public")
          PUBLIC.mkdir(exist_ok=True)

          with open("story.json", "r", encoding="utf-8") as file:
              data = json.load(file)

          scenes = data.get("scenes")

          if not isinstance(scenes, list) or not scenes:
              raise ValueError("story.json has no valid scenes")

          def run_command(command, label, timeout=120):
              print(f"\n[NIO] {label}", flush=True)
              subprocess.run(
                  command,
                  check=True,
                  timeout=timeout
              )

          def clean_urdu_tts(text):
              text = re.sub(r'[\u064B-\u065F\u0670]', '', str(text))
              text = text.replace('ﷺ', ' صلی اللہ علیہ وسلم ')
              text = text.replace('ؓ', ' رضی اللہ عنہ ')
              text = text.replace('ؑ', ' علیہ السلام ')

              replacements = {
                  'قرآنِ': 'قرآن',
                  'ویڈیو': 'وڈیو',
                  'بتاو': 'بتاؤ',
                  'کل کتنی': 'مجموعی طور پر کتنی',
                  'سورت الناس': 'سورہ ان ناس',
                  'سورہ الناس': 'سورہ ان ناس',
                  'سورت الفاتحہ': 'سورہ فاتحہ',
                  'سورت البقرہ': 'سورہ بقرہ',
                  'سورت الکوثر': 'سورہ کوثر',
                  'الرحمن': 'ار رحمن',
                  'الرحیم': 'ار رحیم',
                  '۔': '. ',
                  '،': ', '
              }

              for old, new in replacements.items():
                  text = text.replace(old, new)

              text = re.sub(r'\s+', ' ', text).strip()

              if text and text[-1] not in '.؟!?':
                  text += '.'

              return text

          concat_files = []

          for index, scene in enumerate(scenes):

              speaker = scene.get('speaker', 'teacher')
              final_clip = PUBLIC / f"scene_{index}.mp3"

              print(
                  f"\n[NIO] Scene {index + 1}/{len(scenes)} | {speaker}",
                  flush=True
              )

              if speaker == 'silent':

                  wait_seconds = max(
                      1.0,
                      float(scene.get('durationInSeconds', 5))
                  )

                  run_command([
                      'ffmpeg', '-hide_banner', '-loglevel', 'error',
                      '-y',
                      '-f', 'lavfi',
                      '-i', 'anullsrc=r=24000:cl=mono',
                      '-t', str(wait_seconds),
                      '-c:a', 'libmp3lame',
                      '-b:a', '96k',
                      str(final_clip)
                  ], f"Creating silent scene {index + 1}", 60)

                  scene['durationInSeconds'] = round(wait_seconds, 2)

              else:

                  if speaker == 'student':
                      voice = 'ur-PK-UzmaNeural'
                      rate = '+2%'
                      pitch = '+18Hz'
                  else:
                      voice = data.get('voice', 'ur-PK-AsadNeural')
                      rate = '-8%'
                      pitch = '-3Hz'

                  raw_text = scene.get('ttsText') or scene.get('text', '')
                  spoken = clean_urdu_tts(raw_text)

                  if not spoken:
                      raise ValueError(
                          f"Scene {index + 1} contains no speech text"
                      )

                  raw_clip = PUBLIC / f"scene_{index}_raw.mp3"

                  command = [
                      'edge-tts',
                      '--voice', voice,
                      f'--rate={rate}',
                      f'--pitch={pitch}',
                      '--text', spoken,
                      '--write-media', str(raw_clip)
                  ]

                  for attempt in range(1, 4):
                      try:
                          print(
                              f"[NIO] TTS attempt {attempt}/3 for scene {index + 1}",
                              flush=True
                          )

                          run_command(
                              command,
                              f"Generating {speaker} voice",
                              timeout=90
                          )

                          if not raw_clip.exists() or raw_clip.stat().st_size == 0:
                              raise RuntimeError("TTS produced no audio file")

                          break

                      except (subprocess.TimeoutExpired,
                              subprocess.CalledProcessError,
                              RuntimeError) as error:

                          print(f"[NIO] TTS attempt failed: {error}", flush=True)

                          if attempt == 3:
                              raise RuntimeError(
                                  f"TTS failed for scene {index + 1}"
                              ) from error

                          time.sleep(3)

                  raw_duration = MP3(str(raw_clip)).info.length
                  padded_duration = raw_duration + 0.35

                  run_command([
                      'ffmpeg', '-hide_banner', '-loglevel', 'error',
                      '-y',
                      '-i', str(raw_clip),
                      '-af', 'apad=pad_dur=0.35',
                      '-t', str(padded_duration),
                      '-ar', '24000',
                      '-ac', '1',
                      '-c:a', 'libmp3lame',
                      '-b:a', '96k',
                      str(final_clip)
                  ], f"Preparing scene {index + 1} audio", 60)

                  actual_duration = MP3(str(final_clip)).info.length
                  scene['durationInSeconds'] = round(actual_duration, 2)

              if not final_clip.exists() or final_clip.stat().st_size == 0:
                  raise RuntimeError(
                      f"Audio file missing for scene {index + 1}"
                  )

              # Use an absolute path to avoid FFmpeg path ambiguity.
              concat_files.append(
                  f"file '{final_clip.resolve()}'"
              )

              print(
                  f"[NIO] Scene {index + 1} complete: "
                  f"{scene['durationInSeconds']} seconds",
                  flush=True
              )

          list_file = PUBLIC / "list.txt"

          list_file.write_text(
              '\n'.join(concat_files),
              encoding='utf-8'
          )

          voiceover = PUBLIC / "voiceover.mp3"

          run_command([
              'ffmpeg', '-hide_banner', '-loglevel', 'error',
              '-y',
              '-f', 'concat',
              '-safe', '0',
              '-i', str(list_file.resolve()),
              '-ar', '24000',
              '-ac', '1',
              '-c:a', 'libmp3lame',
              '-b:a', '96k',
              str(voiceover)
          ], "Combining all scene audio", 180)

          if not voiceover.exists() or voiceover.stat().st_size == 0:
              raise RuntimeError("Combined voiceover was not generated")

          with open(PUBLIC / "story.json", "w", encoding="utf-8") as file:
              json.dump(data, file, ensure_ascii=False, indent=2)

          print("\n[NIO] Voice generation completed successfully.", flush=True)
          print(f"[NIO] Total scenes: {len(scenes)}", flush=True)
          print(f"[NIO] Voiceover size: {voiceover.stat().st_size} bytes", flush=True)
          PY

      - name: Install Node dependencies
        timeout-minutes: 10
        run: |
          npm install --no-audit --no-fund

      - name: Render YouTube Short
        timeout-minutes: 30
        run: |
          mkdir -p out
          npx remotion render src/index.ts IslamicVideo out/video.mp4 --bundle-cache=false

      - name: Verify generated video
        run: |
          test -s out/video.mp4
          ls -lh out/video.mp4

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: Islamic-Short-Video
          path: out/video.mp4
          if-no-files-found: error
          retention-days: 7
