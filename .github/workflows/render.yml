
name: Auto Render Islamic Video

on: [push, workflow_dispatch]

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg, Urdu fonts and WebGL libraries
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libgl1 libegl1 libgles2 libgbm1

      
      - name: Install Blender and NumPy
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          echo "PYTHONPATH=/usr/lib/python3/dist-packages" >> $GITHUB_ENV

      - name: Generate Ustad and Student 3D character assets
        timeout-minutes: 10
        run: |
          mkdir -p public/assets
          blender --background --factory-startup --python scripts/build_3d_characters.py
          test -s public/assets/ustad.glb
          test -s public/assets/student.glb
          ls -lh public/assets/*.glb



      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check edge-tts mutagen

      - name: Generate Urdu voices and scene audio
        timeout-minutes: 20
        run: |
          python -u - <<'PY'
          import json
          import re
          import subprocess
          import time
          from pathlib import Path
          from mutagen.mp3 import MP3

          public = Path('public')
          public.mkdir(parents=True, exist_ok=True)

          with open('story.json', 'r', encoding='utf-8') as file:
              data = json.load(file)

          scenes = data.get('scenes')
          if not isinstance(scenes, list) or not scenes:
              raise ValueError('story.json must contain a non-empty scenes array')

          def run_checked(command, label, timeout=120):
              print(f'\n[NIO] {label}', flush=True)
              subprocess.run(command, check=True, timeout=timeout)

          def clean_urdu_tts(text):
              text = re.sub(r'[\u064B-\u065F\u0670]', '', str(text))
              text = text.replace('ﷺ', ' صلی اللہ علیہ وسلم ')
              text = text.replace('ؓ', ' رضی اللہ عنہ ')
              text = text.replace('ؑ', ' علیہ السلام ')
              replacements = {
                  'قرآنِ': 'قرآن',
                  'ویڈیو': 'وڈیو',
                  'بتاو': 'بتاؤ',
                  'کل کتنی': 'مجموعی طور پر کتنی',
                  'سورت الناس': 'سورہ ان ناس',
                  'سورہ الناس': 'سورہ ان ناس',
                  'سورت الفاتحہ': 'سورہ فاتحہ',
                  'سورت البقرہ': 'سورہ بقرہ',
                  'سورت الکوثر': 'سورہ کوثر',
                  'الرحمن': 'ار رحمن',
                  'الرحیم': 'ار رحیم',
                  '۔': '. ',
                  '،': ', '
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              text = re.sub(r'\s+', ' ', text).strip()
              if text and text[-1] not in '.؟!?':
                  text += '.'
              return text

          concat_entries = []

          for index, scene in enumerate(scenes):
              speaker = scene.get('speaker', 'teacher')
              clip = public / f'scene_{index}.mp3'
              print(f'\n[NIO] Scene {index + 1}/{len(scenes)} - {speaker}', flush=True)

              if speaker == 'silent':
                  seconds = max(1.0, float(scene.get('durationInSeconds', 5)))
                  run_checked([
                      'ffmpeg', '-hide_banner', '-loglevel', 'error', '-y',
                      '-f', 'lavfi', '-i', 'anullsrc=r=24000:cl=mono',
                      '-t', str(seconds), '-c:a', 'libmp3lame', '-b:a', '96k',
                      str(clip)
                  ], f'Create silent pause for scene {index + 1}')
                  scene['durationInSeconds'] = round(seconds, 2)

              else:
                  if speaker == 'student':
                      voice, rate, pitch = 'ur-PK-UzmaNeural', '+2%', '+18Hz'
                  else:
                      voice = data.get('voice', 'ur-PK-AsadNeural')
                      rate, pitch = '-8%', '-3Hz'

                  spoken = clean_urdu_tts(scene.get('ttsText') or scene.get('text', ''))
                  if not spoken:
                      raise ValueError(f'Scene {index + 1} has no speech text')

                  raw_clip = public / f'scene_{index}_raw.mp3'
                  command = [
                      'edge-tts', '--voice', voice,
                      f'--rate={rate}', f'--pitch={pitch}',
                      '--text', spoken, '--write-media', str(raw_clip)
                  ]

                  for attempt in range(1, 4):
                      try:
                          print(f'[NIO] Urdu TTS attempt {attempt}/3', flush=True)
                          subprocess.run(command, check=True, timeout=90)
                          if not raw_clip.exists() or raw_clip.stat().st_size == 0:
                              raise RuntimeError('TTS returned an empty audio file')
                          break
                      except (subprocess.TimeoutExpired, subprocess.CalledProcessError, RuntimeError) as error:
                          print(f'[NIO] TTS attempt failed: {error}', flush=True)
                          if attempt == 3:
                              raise RuntimeError(f'TTS failed for scene {index + 1}') from error
                          time.sleep(attempt * 3)

                  run_checked([
                      'ffmpeg', '-hide_banner', '-loglevel', 'error', '-y',
                      '-i', str(raw_clip), '-ar', '24000', '-ac', '1',
                      '-c:a', 'libmp3lame', '-b:a', '96k', str(clip)
                  ], f'Normalize scene {index + 1} audio')

                  scene['durationInSeconds'] = round(MP3(str(clip)).info.length, 2)

              if not clip.exists() or clip.stat().st_size == 0:
                  raise RuntimeError(f'Audio file missing for scene {index + 1}')

              concat_entries.append(f"file '{clip.resolve()}'")
              print(f"[NIO] Scene {index + 1} ready ({scene['durationInSeconds']} sec)", flush=True)

          concat_file = public / 'list.txt'
          concat_file.write_text('\n'.join(concat_entries), encoding='utf-8')

          voiceover = public / 'voiceover.mp3'
          run_checked([
              'ffmpeg', '-hide_banner', '-loglevel', 'error', '-y',
              '-f', 'concat', '-safe', '0', '-i', str(concat_file.resolve()),
              '-ar', '24000', '-ac', '1', '-c:a', 'libmp3lame', '-b:a', '128k',
              str(voiceover)
          ], 'Combine Urdu voiceover', timeout=180)

          if not voiceover.exists() or voiceover.stat().st_size == 0:
              raise RuntimeError('Combined voiceover was not generated')

          with open(public / 'story.json', 'w', encoding='utf-8') as file:
              json.dump(data, file, ensure_ascii=False, indent=2)

          print(f'\n[NIO] Voice generation complete: {len(scenes)} scenes', flush=True)
          print(f'[NIO] Voiceover size: {voiceover.stat().st_size} bytes', flush=True)
          PY

      - name: Install Node dependencies
        timeout-minutes: 10
        run: npm install --no-audit --no-fund

      - name: Render first 3D preview frame
        timeout-minutes: 10
        run: |
          mkdir -p out
          npx remotion still src/index.ts IslamicVideo out/3d-preview.png --frame=0 --gl=swiftshader --bundle-cache=false

      - name: Upload 3D preview
        uses: actions/upload-artifact@v4
        with:
          name: Islamic-3D-Classroom-Preview
          path: out/3d-preview.png
          if-no-files-found: error
          retention-days: 7

      - name: Render YouTube Short
        timeout-minutes: 180
        run: |
          npx remotion render src/index.ts IslamicVideo out/video.mp4 --bundle-cache=false --gl=swiftshader --concurrency=1

      - name: Verify generated video
        run: |
          test -s out/video.mp4
          ls -lh out/video.mp4

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: Islamic-Short-Video
          path: out/video.mp4
          if-no-files-found: error
          retention-days: 7
