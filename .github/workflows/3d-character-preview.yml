name: Build Educational Cartoon Characters and Preview

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_3d_characters.py'
      - 'src/three/Classroom3D.tsx'
      - '.github/workflows/3d-character-preview.yml'
      - 'src/index.ts'
      - 'story.json'

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender and required system libraries
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy ffmpeg libgl1 libegl1 libgles2 libgbm1

      - name: Generate Ustad and Student cartoon GLB files
        timeout-minutes: 15
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          mkdir -p public/assets
          blender --background --factory-startup --python scripts/build_3d_characters.py
          test -s public/assets/ustad.glb
          test -s public/assets/student.glb
          ls -lh public/assets/*.glb
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare preview audio and story
        run: |
          mkdir -p public out
          cp story.json public/story.json
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i anullsrc=r=24000:cl=mono -t 8 -c:a libmp3lame -b:a 64k public/voiceover.mp3

      - name: Render 3-second educational cartoon preview
        timeout-minutes: 15
        run: |
          npx remotion render src/index.ts IslamicVideo out/educational-cartoon-preview.mp4 --frames=0-89 --codec=h264 --crf=25 --gl=swiftshader --concurrency=1 --bundle-cache=false

      - name: Upload characters and preview
        uses: actions/upload-artifact@v4
        with:
          name: Islamic-Educational-Cartoon-Preview
          path: |
            public/assets/ustad.glb
            public/assets/student.glb
            out/educational-cartoon-preview.mp4
          if-no-files-found: error
          retention-days: 14
